[project]
name = "kpmg-ai-data-platform"
version = "0.1.0"
description = "Cloud-native FastAPI platform for GenAI, multi-agent workflows, and data engineering."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pgvector>=0.3.2",
  "httpx>=0.27.0",
  "langchain>=0.2.14",
  "langchain-openai>=0.1.22",
  "langchain-anthropic>=0.1.23",
  "langchain-google-genai>=2.0.0",
  "langgraph>=0.2.14",
  "azure-identity>=1.17.1",
  "azure-storage-blob>=12.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
